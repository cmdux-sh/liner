name: Platform Bundles

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package to build and upload."
        required: true
        type: choice
        options:
          - linersh-darwin-arm64
          - linersh-darwin-x64
          - linersh-linux-arm64
          - linersh-linux-x64
          - linersh-win32-x64
          - linersh

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve target
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      kind: ${{ steps.resolve.outputs.kind }}
    steps:
      - id: resolve
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            linersh-darwin-arm64)
              echo "runner=macos-15" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh-darwin-x64)
              echo "runner=macos-15-intel" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh-linux-arm64)
              echo "runner=ubuntu-24.04-arm" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh-linux-x64)
              echo "runner=ubuntu-24.04" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh-win32-x64)
              echo "runner=windows-2025" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh)
              echo "runner=ubuntu-24.04" >> "$GITHUB_OUTPUT"
              echo "kind=main" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac

  build:
    name: Build ${{ inputs.target }}
    needs: resolve-target
    runs-on: ${{ needs.resolve-target.outputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        if: ${{ needs.resolve-target.outputs.kind == 'platform' || needs.resolve-target.outputs.kind == 'main' }}
        with:
          go-version-file: packages/go-tui/go.mod

      - uses: astral-sh/setup-uv@v6
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}

      - name: Build platform package
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        shell: bash
        run: |
          python scripts/build-platform-package.py
          test -d "packages/platform/${{ inputs.target }}"

      - name: Validate platform package
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        shell: bash
        run: python scripts/validate-platform-package.py --pack-dry-run "packages/platform/${{ inputs.target }}"

      - name: Pack platform package
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          npm pack "packages/platform/${{ inputs.target }}" --pack-destination release-artifacts

      - name: Install TUI dependencies
        if: ${{ needs.resolve-target.outputs.kind == 'main' }}
        working-directory: packages/tui
        run: npm ci

      - name: Verify TUI package
        if: ${{ needs.resolve-target.outputs.kind == 'main' }}
        working-directory: packages/tui
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          npm pack --dry-run

      - name: Pack TUI package
        if: ${{ needs.resolve-target.outputs.kind == 'main' }}
        working-directory: packages/tui
        run: |
          mkdir -p ../../release-artifacts
          npm pack --pack-destination ../../release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1
