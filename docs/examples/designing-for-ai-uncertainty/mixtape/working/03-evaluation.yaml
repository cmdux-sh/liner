  - url: https://www.nist.gov/itl/ai-risk-management-framework
    title: AI Risk Management Framework
    decision: kept
    section: "Section 5: Abstention, deferral, and escalation"
    rationale: The primary framework gives the agent an authoritative basis for
      risk-sensitive refusal, staged release, human responsibility, and stopping
      rules, while remaining general enough to apply across AI features.
    rating: 4
    jtbd_fit: direct
    kind: reference
    note: "Role: Keep as the primary authority for deciding when an AI feature's
      risk and uncertainty should change its operating mode. Value: Use the
      risk-tolerance, residual-risk, lifecycle, and stop-until-managed passages
      to justify deferral, human confirmation, or escalation instead of treating
      trust as a visual treatment. Limitations: It is voluntary, high-level, and
      organizational; it does not specify user-facing copy, interaction layouts,
      or a complete runtime abstention algorithm."
    fetch_status: readable
    content_quality: high
    evidence:
      - The recovered AI RMF 1.0 defines risk through both likelihood and
        consequence, makes risk tolerance context- and use-case-specific, and
        says unacceptable negative risk can require stopping development or
        deployment until it is managed.
      - The framework organizes action through GOVERN, MAP, MEASURE, and MANAGE,
        and explicitly treats residual risk, lifecycle roles, testing,
        evaluation, verification, and validation as operational responsibilities
        rather than interface decoration.
