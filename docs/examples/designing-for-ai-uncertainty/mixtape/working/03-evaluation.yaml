  - url: https://pair.withgoogle.com/guidebook-v2/chapter/feedback-controls/
    title: Feedback + Control
    decision: kept
    section: "Section 4: Verification, correction, and recovery"
    rationale: It gives concrete interaction patterns for correcting AI output and
      retaining human control, though its feedback-loop emphasis extends beyond
      one-off verification.
    rating: 4
    jtbd_fit: direct
    kind: prescription
    note: "Role: Core interaction guidance for correction and control. Value: Use
      the sections on manual fallback, editability, reset, and feedback impact
      when designing recovery. Limitations: Mostly practitioner guidance, with
      limited empirical validation of the patterns."
    fetch_status: readable
    content_quality: high
    evidence:
      - The chapter distinguishes implicit from explicit feedback and says users
        should be told what is collected, why it is collected, and how they can
        opt out or inspect their data.
      - Its control guidance recommends manual fallbacks, editable preferences,
        resettable personalization, and clear communication about when feedback
        will change the experience.
  - url: https://pair.withgoogle.com/guidebook-v2/chapter/errors-failing/
    title: Errors + Graceful Failure
    decision: kept
    section: "Section 4: Verification, correction, and recovery"
    rationale: This is the strongest direct source in the section because it
      connects uncertainty and error diagnosis to concrete correction paths,
      safer alternatives, and human takeover.
    rating: 5
    jtbd_fit: direct
    kind: prescription
    note: "Role: Load-bearing method for failure and recovery design. Value: Route
      here for error taxonomy, risk-sensitive responses, feedback opportunities,
      and handoff to manual control. Limitations: Google practitioner guidance;
      examples are illustrative rather than independently evaluated product
      results."
    fetch_status: readable
    content_quality: high
    evidence:
      - The chapter separates system-limitation, context, and background errors,
        then asks teams to assess user impact and situational stakes rather than
        treating every failure alike.
      - It gives response patterns for low confidence, missing data, mislabeled
        outputs, and irrelevant results, including explaining limits, offering
        alternative paths, soliciting feedback, and returning control to the
        user.
      - Its recovery guidance says manual takeover must provide awareness of the
        situation, the next action, and how to perform it, and warns that
        high-stakes alternatives need an additional safety check.
  - url: https://arxiv.org/abs/2001.02478
    title: "Questioning the AI: Informing Design Practices for Explainable AI User
      Experiences"
    decision: dropped
    section: "Section 4: Verification, correction, and recovery"
    rationale: The direct read exposed only the abstract and metadata, and the one
      alternate HTML recovery failed, so the paper cannot meet the
      substantive-content evidence contract.
  - url: https://arxiv.org/abs/2104.03483
    title: Question-Driven Design Process for Explainable AI User Experiences
    decision: kept
    section: "Section 4: Verification, correction, and recovery"
    rationale: It supplies a repeatable bridge from user questions to inspectable
      explanations, reliability judgments, actionable correction, and
      designer-engineer handoff.
    rating: 5
    jtbd_fit: direct
    kind: prescription
    note: "Role: Core method for turning “how should I check this?” into design and
      engineering requirements. Value: Use the question elicitation,
      prioritization, mapping, and iterative evaluation steps. Limitations: The
      worked case is healthcare prediction, and the final system was partly
      proprietary."
    fetch_status: readable
    content_quality: high
    evidence:
      - The paper proposes eliciting user questions, probing the intent and
        expected answer behind each question, clustering questions separately
        from underlying requirements, and using those results to prioritize
        explanations.
      - In the healthcare case, participants asked about why a prediction
        occurred, what could reduce risk, the training data, and where
        performance degrades; the resulting requirements included assessing
        prediction reliability and deciding when to investigate further.
      - The iterative prototype exposed that raw contrastive explanations
        suggested unchangeable risk factors; the team constrained the model and
        linked actionable factors such as pneumonia risk and smoking to relevant
        resources.
  - url: https://pair.withgoogle.com/guidebook-v2/case-studies
    title: People + AI Research — Case Studies
    decision: trim
    section: "Section 4: Verification, correction, and recovery"
