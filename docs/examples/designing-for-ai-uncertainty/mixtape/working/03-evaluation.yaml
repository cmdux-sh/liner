    fetch_status: readable
    content_quality: medium
    evidence:
      - The paper frames generative AI around variability and imperfection,
        including misleading answers, missing constraints, code errors, and the
        need to identify which output portions require human review.
      - Its principles recommend multiple outputs, visualizing differences,
        evaluation or domain-specific quality signals, controls or sandboxing,
