  - url: https://aclanthology.org/2023.emnlp-main.398/
    title: Enabling Large Language Models to Generate Text with Citations
    decision: kept
    section: "Section 3: Showing evidence people can inspect"
    rationale: Keep as the load-bearing evaluation source because it shows that
      citations must be tested for completeness and relevance, not treated as a
      generic trust cue.
    rating: 5
    jtbd_fit: direct
    kind: principle
    note: "Role: Foundational method for evaluating inspectable generated answers.
      Value: Separates correctness from citation support and gives reusable
      recall/precision tests. Limitations: Benchmark findings concern retrieved
      QA, not a finished product interaction."
    fetch_status: readable
    content_quality: high
    evidence:
      - The ALCE benchmark separates answer quality into fluency, correctness,
        and citation quality, with citation quality decomposed into support
        recall and citation precision.
      - The paper reports that even the best ELI5 systems lack complete citation
        support about half the time, and its human evaluation compares utility,
        citation recall, and citation precision.
  - url: https://arxiv.org/abs/2210.08726
    title: "RARR: Researching and Revising What Language Models Say, Using Language
      Models"
    decision: kept
    section: "Section 3: Showing evidence people can inspect"
    rationale: Keep as a concrete inspect-and-repair method that connects evidence
      retrieval to correction rather than stopping at explanation or citation
      display.
    rating: 5
    jtbd_fit: direct
    kind: example
    note: "Role: Core method for claim-level verification and repair. Value: Shows
      how to expose evidence and correct only unsupported portions while
      preserving useful structure. Limitations: Its automated web-search and
      editing pipeline can inherit retrieval or source-quality errors and is not
      a UI prescription."
    fetch_status: readable
    content_quality: high
    evidence:
      - RARR generates claim-focused search queries, checks agreement between
        each claim and retrieved evidence, and revises unsupported text while
        preserving the original passage where possible.
      - The paper’s nasal-cycle example changes an unsupported 45-minute claim
        to an evidence-backed two-hour claim, while its attribution examples
        distinguish fully supported claims from superficially overlapping
        evidence.
  - url: https://arxiv.org/abs/2112.09332
    title: "WebGPT: Browser-assisted question-answering with human feedback"
    decision: trim
    section: "Section 3: Showing evidence people can inspect"
    rationale: Trim to the browser-and-reference workflow and its source-quality
      failure mode; the training and reward-model detail overlaps stronger
      citation-method papers.
    rating: 3
    jtbd_fit: direct
    kind: example
    note: "Role: Early system example linking browsing, references, and human
      evaluation. Value: Use the environment design and TruthfulQA failure
      analysis to explain why visible references do not guarantee reliable
      evidence. Limitations: Dated model-training focus and limited
      product-interface guidance; skip most optimization details."
    fetch_status: readable
    content_quality: high
    evidence:
      - WebGPT trains a browser-using model with imitation learning and human
        feedback, requiring it to collect references while browsing so
        evaluators can judge factual accuracy.
      - The TruthfulQA analysis reports that the system still sometimes quotes
        unreliable sources after distribution shift, and the paper documents
        labeler agreement and the long demonstration/comparison tasks.
  - url: https://arxiv.org/abs/2203.11147
    title: Teaching language models to support answers with verified quotes
    decision: kept
    section: "Section 3: Showing evidence people can inspect"
    rationale: Keep because it provides a strong quote-level evidence model plus a
      critical warning that support and truth are distinct judgments.
    rating: 4
    jtbd_fit: direct
    kind: example
    note: "Role: Direct evidence-grounding and abstention reference. Value: Gives
      the agent a concrete claim-plus-quote structure and a test for whether
      evidence is sufficient, relevant, and truthful. Limitations: Model-centric
      evaluation and paid-rater judgments do not establish that end users will
      inspect quotes successfully."
    fetch_status: readable
    content_quality: high
    evidence:
      - GopherCite presents answers with separate claims and quote evidence, and
        human raters judge plausibility and whether the accompanying quote is
        sufficient to support the whole answer.
      - The results show substantially different supported-and-plausible rates
        across retrieval and training setups, while the TruthfulQA examples
        expose cases where evidence can support a claim literally without making
        it truthful.
  - url: https://aclanthology.org/2024.acl-long.161/
    title: Training Language Models to Generate Text with Citations via Fine-Grained
      Rewards
    decision: trim
    section: "Section 3: Showing evidence people can inspect"
    rationale: "Trim as a recent technical complement to ALCE: retain its
      evidence/correctness tradeoff and concrete citation failure taxonomy, but
      omit most fine-tuning mechanics."
    rating: 3
    jtbd_fit: direct
    kind: example
    note: "Role: Failure-focused complement to the citation benchmarks. Value:
      Demonstrates that answer correctness, citation recall, and citation
      precision trade off, with concrete ID-mixup and redundancy errors.
      Limitations: Primarily a fine-tuning paper; it offers little guidance on
      how people should inspect citations in a product."
    fetch_status: readable
    content_quality: high
    evidence:
      - The method gives separate rewards for answer correctness, citation
        recall, and citation precision, and shows that optimizing only
        correctness causes citation quality to fall quickly.
      - Its inspection of 30 test examples identifies citation-specific failures
        including mixed-up passage IDs and redundant irrelevant citations, while
        retrieval limits constrain what the model can support.
  - url: https://pair.withgoogle.com/guidebook-v2/chapter/data-collection/
    title: Data Collection + Evaluation
    decision: trim
    section: "Section 3: Showing evidence people can inspect"
