  - url: https://pubmed.ncbi.nlm.nih.gov/38184595/
    title: "AI-driven decision support systems and epistemic reliance: a qualitative
      study on obstetricians' and midwives' perspectives on integrating AI-driven
      CTG into clinical decision making"
    decision: trim
    section: "Section 6: Evaluation and failure-focused critique"
    rationale: Trim as a verified frontline-practitioner stance on what evidence,
      transparency, authority, and responsibility must mean when imperfect AI
      enters a consequential workflow; its clinical scope limits transfer.
    rating: 3
    jtbd_fit: bridge
    kind: principle
    note: "Role: Use as the frontline domain-expert counterweight to generic
      product guidance. Value: Treat professional responsibility and the user's
      ability to judge reliability on their own terms as design constraints, not
      as trust deficits to overcome. Limitations: Only the detailed abstract was
      retrieved, the interview sample was 13 UK obstetricians and midwives, and
      the cardiotocography setting cannot establish a general interface pattern."
    fetch_status: partial
    content_quality: high
    evidence:
      - The qualitative study used semi-structured interviews with eight
        obstetricians and five midwives about when AI-driven cardiotocography
        could justifiably enter decisions about interventions in labor.
      - Participants required accuracy, efficiency, personalization,
        transparency, and evidence of improved outcomes, while treating
        themselves as the epistemic authorities and responsibility holders in
        the clinical context.
      - The paper concludes that clinicians need to evaluate system reliability
        on their own terms, rather than being asked to accept institutional or
        developer authority as a substitute.
  - url: https://www.sciencedirect.com/science/article/pii/S000437022300098X
    title: The Effects of Explanations on Automation Bias
    decision: kept
    section: "Section 6: Evaluation and failure-focused critique"
    rationale: The full paper supplies a primary, failure-focused test showing that
      explanations can improve speed or accuracy without producing appropriately
      calibrated reliance.
    rating: 5
    jtbd_fit: direct
    kind: principle
    note: "Role: Use as the empirical warning against treating explanations as an
      automatic safeguard. Value: Its two-task comparison and first-impression
      manipulation connect interface treatment to behavioral reliance.
      Limitations: Findings are task- and explanation-specific; it does not
      establish a universal best explanation pattern."
    fetch_status: readable
    content_quality: high
    evidence:
      - The paper reports two experiments, using a Coloured Trails decision task
        and a simulated radiological task, that measure automation bias,
        decision accuracy, task load, trust, and completion time.
      - Across the studies, explanations did not reduce agreement with erroneous
        AI advice and sometimes increased automation bias, while local
        explanations often improved accuracy and reduced completion time.
      - The initial-training manipulation shows that positive versus negative
        first impressions changed automation bias, accuracy, and trust, making
        context and prior exposure part of the evaluation frame.
