  - url: https://www.w3.org/WAI/WCAG22/Understanding/error-prevention-legal-financial-data.html
    title: "Understanding Success Criterion 3.3.4: Error Prevention (Legal,
      Financial, Data)"
    decision: kept
    section: "Section 5: Abstention, deferral, and escalation"
    rationale: This authoritative, behavior-level guidance supplies a transferable
      rule for keeping uncertain AI output from directly causing irreversible
      legal, financial, or data actions.
    rating: 4
    jtbd_fit: direct
    kind: prescription
    note: "Role: Keep as the concrete safeguard authority for consequential actions
      that an AI feature may prepare or trigger. Value: Use its reversible,
      checked, or confirmed pattern to turn uncertainty into a review,
      correction, or draft-before-commit state. Limitations: It is an
      accessibility success criterion for web pages and specified transaction
      types, not an AI-specific abstention rule; apply the interaction pattern
      without claiming WCAG conformance or complete risk coverage from it
      alone."
    fetch_status: readable
    content_quality: high
    evidence:
      - "The W3C explanation gives three concrete safeguards for consequential
        submissions: make them reversible, check input and provide correction,
        or provide a review-and-confirm mechanism before finalization."
      - Its examples cover non-refundable airline tickets, stock purchases,
        legal commitments, and unrecoverable data deletion, showing why
        confirmation and recovery should scale with consequence.
