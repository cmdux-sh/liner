  - url: https://scholars.duke.edu/publication/1163926
    title: "Trust in Automation: Integrating Empirical Evidence on Factors That
      Influence Trust"
    decision: kept
    section: "Section 1: The reliance decision"
    rationale: This is a dense empirical synthesis that gives the agent a usable
      distinction between trust and reliance and a context-sensitive model for
      diagnosing calibration problems.
    rating: 4
    jtbd_fit: direct
    kind: principle
    note: "Role: Keep as the main empirical synthesis for calibrated reliance.
      Value: Use the three trust layers and situational moderators to frame
      feature-specific reliance decisions. Limitations: It reviews automation
      studies from 2002–2013 and predates generative-AI interaction patterns."
    fetch_status: readable
    content_quality: high
    evidence:
      - The full review reports a systematic screen of 101 papers containing 127
        eligible human-subject studies on trust-related behavior in automation.
      - Its three-layer model separates dispositional, situational, and learned
        trust, then connects those layers to design recommendations,
        environmental moderators, and appropriate reliance.
      - The review states that trust guides but does not completely determine
        reliance, identifying decisional freedom, time pressure, comparison with
        manual performance, and task complexity as important conditions.
      - Its conclusion flags unresolved variation by error type and consequence,
        rather than treating trust as a single stable user attitude.
  - url: https://www.sciencedirect.com/science/article/pii/S0749597818303388
    title: "Algorithm Appreciation: People Prefer Algorithmic to Human Judgment"
    decision: dropped
    section: "Section 1: The reliance decision"
    rationale: ScienceDirect returned 403 and one author-manuscript recovery did not
      yield a readable body, so the apparent multi-study findings cannot be
      retained from snippets alone.
  - url: https://faculty.wharton.upenn.edu/wp-content/uploads/2016/11/20-Dietvorst-Simmons-Massey-2015.pdf
    title: "Algorithm Aversion: People Erroneously Avoid Algorithms After Seeing
      Them Err"
    decision: kept
    section: "Section 1: The reliance decision"
    rationale: This primary study is a useful counterweight to over-reliance
      narratives because it shows how imperfect outputs can also produce
      premature abandonment of better automation.
    rating: 4
    jtbd_fit: direct
    kind: principle
    note: "Role: Keep as the failure-focused counterpoint to over-reliance research.
      Value: Use its five-study evidence to ask whether error displays or early
      failures will cause disuse even when the aid is superior. Limitations: The
      forecasting and incentive tasks concern statistical prediction, not
      generative explanations or product UI patterns."
    fetch_status: readable
    content_quality: high
    evidence:
      - Across five studies using real forecasting tasks, participants who saw
        an algorithm perform became less likely to choose it, even when the
        algorithm outperformed the human alternative.
      - The paper reports that seeing the model perform reduced confidence and
        optimism in its forecasts beyond the effect of the model's observed
        errors alone, showing why visible mistakes can trigger disuse.
      - The authors measure behavioral choice, confidence, beliefs, and
        perceived attributes such as detecting exceptions and avoiding obvious
        mistakes rather than relying only on stated trust.
      - The discussion notes that some participants continued to use the
        algorithm after errors, so aversion is not a universal response and
        depends on the system and decision context.
  - url: https://ojs.aaai.org/index.php/HCOMP/article/view/5285
    title: "Beyond Accuracy: The Role of Mental Models in Human-AI Team Performance"
    decision: kept
    section: "Section 1: The reliance decision"
    rationale: "This primary human-AI team study translates appropriate reliance
      into an observable design problem: users need a learnable model of when
      the system is likely to fail."
    rating: 4
    jtbd_fit: direct
    kind: example
    note: "Role: Keep as the mental-model and error-boundary method. Value: Use it
      to specify what users must learn before asking them to accept or override
      an AI output and what feedback can teach them. Limitations: The controlled
      binary-classifier game and MTurk sample do not directly establish patterns
      for summaries, answers, or recommendations."
    fetch_status: readable
    content_quality: high
    evidence:
      - The paper defines an AI error boundary as the cases where the system is
        correct or incorrect and argues that a human mental model of this
        boundary determines when to accept or override a recommendation.
      - In CAJA user studies, participants received feedback after
        accept-or-override decisions; the experiments vary error-boundary
        parsimony, stochasticity, task dimensionality, interaction length, and
        the cost of mistakes.
      - Results show that parsimonious and non-stochastic error boundaries
        improve mental-model formation, while higher-dimensional or
        representation-mismatched tasks make the boundary harder to learn.
      - The worked assembly-line task shows early false accepts and false
        overrides decreasing as users update their model from feedback, linking
        learnability to team performance rather than accuracy alone.
  - url: https://www.iis.seas.harvard.edu/papers/2021/bucinca2021trust.shtml
    title: "To Trust or to Think: Cognitive Forcing Functions Can Reduce
