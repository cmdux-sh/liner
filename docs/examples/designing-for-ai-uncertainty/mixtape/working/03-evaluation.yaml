  - url: https://pair.withgoogle.com/guidebook-v2/patterns
    title: Patterns
    decision: kept
    section: "Section 3: Showing evidence people can inspect"
    rationale: "Keep as the practical interaction translation: it turns evidence,
      confidence, error recovery, and supervision into observable product
      patterns across recommendations and generated content."
    rating: 4
    jtbd_fit: direct
    kind: prescription
    note: "Role: Practitioner pattern reference for turning evidence and uncertainty
      into controls. Value: Supplies concrete “aim/avoid” guidance for sources,
      confidence displays, feedback, supervision, and handoff. Limitations:
      Google guidebook advice is not a controlled evaluation and its examples
      should not be treated as outcome proof."
    fetch_status: readable
    content_quality: high
    evidence:
      - The patterns recommend adding third-party or expert context so users can
        appraise recommendations, and explicitly warn that numeric confidence
        can be hard to interpret without an alternative or recourse.
      - The page connects errors to concrete responses—manual controls,
        feedback/reporting, supervision, and human handoff—and includes examples
        such as reviewing generated citations and flagging recommendations.
  - url: https://www.ibm.com/design/ai/ethics/explainability/
    title: Explainability
    decision: dropped
    section: "Section 3: Showing evidence people can inspect"
    rationale: Drop because the readable page is vendor ethics guidance with broad
