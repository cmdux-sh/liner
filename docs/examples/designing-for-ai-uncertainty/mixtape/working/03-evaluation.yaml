  - url: https://arxiv.org/abs/2102.09692
    title: "To Trust or to Think: Cognitive Forcing Functions Can Reduce
      Overreliance on AI in AI-Assisted Decision-Making"
    decision: kept
    section: "Section 6: Evaluation and failure-focused critique"
    rationale: This primary experiment directly tests behavioral reliance and shows
      why verification friction, preference, trust, and subgroup effects must be
      evaluated together.
    rating: 5
    jtbd_fit: direct
    kind: principle
    note: "Role: Use as the failure-focused empirical anchor for deciding when
      explanations need deliberate verification friction. Value: It compares
      concrete interaction patterns against behavioral error detection and
      reports acceptability and subgroup tradeoffs. Limitations: The
      food-substitution task is non-critical and the authors caution against
      generalizing without further domain studies."
    fetch_status: readable
    content_quality: high
    evidence:
      - The experiment with 199 participants compares three cognitive-forcing
        designs with simple explainable-AI conditions and a no-AI baseline,
        including on-demand disclosure, an initial human decision before AI
        feedback, and a 30-second wait.
      - When the simulated AI was wrong, cognitive-forcing conditions produced
        more correct decisions and less overreliance than simple explanations
        for key measures, although overreliance was reduced rather than
        eliminated.
      - The paper finds a tradeoff between effectiveness and acceptability, and
        its subgroup analysis shows greater benefits for participants high in
        Need for Cognition, with a single non-critical task limiting
        generalization.
