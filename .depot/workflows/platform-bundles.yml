name: Platform Bundles

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package to build and upload."
        required: true
        type: choice
        options:
          - linersh-linux-arm64
          - linersh-linux-x64
          - linersh

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve target
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      kind: ${{ steps.resolve.outputs.kind }}
    steps:
      - name: Enforce free-trial cutoff
        shell: bash
        run: |
          if [[ "$(date -u +%s)" -ge 1793119680 ]]; then
            echo 'Depot trial ended; hosted work is paused.' >&2
            exit 1
          fi

      - id: resolve
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            linersh-linux-arm64)
              echo "runner=depot-ubuntu-24.04-arm" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh-linux-x64)
              echo "runner=depot-ubuntu-24.04" >> "$GITHUB_OUTPUT"
              echo "kind=platform" >> "$GITHUB_OUTPUT"
              ;;
            linersh)
              echo "runner=depot-ubuntu-24.04" >> "$GITHUB_OUTPUT"
              echo "kind=main" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac

  public-surface:
    name: Verify release truth and public site
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce free-trial cutoff
        shell: bash
        run: |
          if [[ "$(date -u +%s)" -ge 1793119680 ]]; then
            echo 'Depot trial ended; hosted work is paused.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Verify canonical release metadata
        run: uv run python scripts/release-version.py --check --check-registry

      - name: Verify public maintenance command documentation
        run: uv run python scripts/validate-public-commands.py

      - name: Verify public agent-maintenance story
        run: uv run python scripts/validate-public-surfaces.py

      - name: Install public site dependencies
        working-directory: marketing/site
        run: npm ci

      - name: Build public site
        working-directory: marketing/site
        run: npm run build

  build:
    name: Build ${{ inputs.target }}
    needs: [resolve-target, public-surface]
    runs-on: ${{ needs.resolve-target.outputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Enforce free-trial cutoff
        shell: bash
        run: |
          if [[ "$(date -u +%s)" -ge 1793119680 ]]; then
            echo 'Depot trial ended; hosted work is paused.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        if: ${{ needs.resolve-target.outputs.kind == 'platform' || needs.resolve-target.outputs.kind == 'main' }}
        with:
          go-version-file: packages/go-tui/go.mod

      - uses: astral-sh/setup-uv@v6

      - name: Build platform package
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        shell: bash
        run: |
          python scripts/build-platform-package.py
          test -d "packages/platform/${{ inputs.target }}"

      - name: Validate platform package
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        shell: bash
        run: python scripts/validate-platform-package.py --pack-dry-run "packages/platform/${{ inputs.target }}"

      - name: Pack platform package
        if: ${{ needs.resolve-target.outputs.kind == 'platform' }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          npm pack "packages/platform/${{ inputs.target }}" --pack-destination release-artifacts

      - name: Install TUI dependencies
        if: ${{ needs.resolve-target.outputs.kind == 'main' }}
        working-directory: packages/tui
        run: npm ci

      - name: Verify TUI package
        if: ${{ needs.resolve-target.outputs.kind == 'main' }}
        working-directory: packages/tui
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          npm pack --dry-run

      - name: Pack TUI package
        if: ${{ needs.resolve-target.outputs.kind == 'main' }}
        working-directory: packages/tui
        run: |
          mkdir -p ../../release-artifacts
          npm pack --pack-destination ../../release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1
